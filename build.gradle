plugins {
    id 'java'
}

group = 'io.github.ethankelly'
version = '0.2.0-SNAPSHOT'

def javaVersion = JavaVersion.VERSION_17

java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            setSrcDirs(['src'])
        }
    }
    test {
        java {
            setSrcDirs(['test'])
        }
    }
}

dependencies {
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'tech.tablesaw:tablesaw-core:0.38.5'
    implementation 'tech.tablesaw:tablesaw-jsplot:0.38.5'
    implementation 'org.jetbrains:annotations:24.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'org.mockito:mockito-core:5.11.0'
}

tasks.withType(JavaCompile).configureEach { compileTask ->
    compileTask.options.encoding = 'UTF-8'
    compileTask.options.compilerArgs += ['-parameters']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('runtimeJar', Jar) {
    group = 'build'
    description = 'Assembles a runnable fat jar for runtime experiments.'
    archiveFileName.set('equations-runtime.jar')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('Main-Class': 'io.github.ethankelly.experiments.RuntimeExperimentRunner')
    }
    from(sourceSets.main.get().output)
    dependsOn(configurations.runtimeClasspath)
    dependsOn(tasks.named('classes'))
    from {
        configurations.runtimeClasspath.get().collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }
}

tasks.named('build') {
    dependsOn('runtimeJar')
}
